services:
  database:
    image: postgres:18.4
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "postgres"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 10s
volumes:
  db-data: {}
